<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✈️ 해진 & 양재 유럽여행</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #eef1f6;
    --border: #dde2ec;
    --accent: #2563eb;
    --accent2: #7c3aed;
    --green: #16a34a;
    --yellow: #d97706;
    --red: #dc2626;
    --text: #111827;
    --text2: #4b5563;
    --text3: #9ca3af;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── 헤더 ── */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #eef1f6 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent); }
  .sync-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); padding: 6px 12px; border-radius: 20px;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .sync-btn:active { opacity: 0.7; }
  .date-range { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── 탭 ── */
  .tabs {
    display: flex; overflow-x: auto; gap: 6px;
    padding: 12px 20px 0; scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 8px 14px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    font-size: 12px; font-weight: 500; cursor: pointer;
    color: var(--text2); border: 1px solid transparent;
    border-bottom: none; transition: all 0.15s;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--bg); color: var(--accent);
    border-color: var(--border); border-bottom-color: var(--bg);
  }

  /* ── 콘텐츠 ── */
  .content { padding: 16px 16px 0; }
  .section { display: none; }
  .section.active { display: block; }

  /* ── 로딩 ── */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 20px; gap: 14px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--text2); font-size: 13px; }

  /* ── 카드 공통 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .card-header:active { opacity: 0.8; }
  .card-body { padding: 0 14px 14px; display: none; }
  .card.open .card-body { display: block; }
  .card-chevron {
    margin-left: auto; color: var(--text3); font-size: 11px;
    transition: transform 0.2s;
  }
  .card.open .card-chevron { transform: rotate(180deg); }

  /* ── 날짜 배지 ── */
  .date-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px;
    font-size: 11px; color: var(--text2); font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
  }
  .date-badge.today { background: rgba(37,99,235,0.10); border-color: var(--accent); color: var(--accent); }
  .date-badge.past { opacity: 0.4; }

  /* ── 전체일정 ── */
  .schedule-day { margin-bottom: 6px; }
  .schedule-day.today-card {
    border: 2px solid var(--accent) !important;
    box-shadow: 0 4px 16px rgba(37,99,235,0.15);
  }
  .schedule-day.today-card .card-header {
    background: rgba(37,99,235,0.05);
  }
  .schedule-day.has-flight {
    border: 2px solid var(--yellow) !important;
    box-shadow: 0 2px 10px rgba(217,119,6,0.12);
  }
  .schedule-day.today-card.has-flight {
    border: 2px solid var(--accent) !important;
    box-shadow: 0 4px 16px rgba(37,99,235,0.15);
  }
  .day-title {
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
    flex: 1; min-width: 0;
  }
  .day-place-main {
    font-size: 14px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .day-dow { color: var(--text3); font-size: 11px; flex-shrink: 0; }
  .day-dow.sat { color: var(--accent); }
  .day-dow.sun { color: var(--red); }
  .info-row {
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .tag {
    font-size: 11px; padding: 3px 8px; border-radius: 20px;
    white-space: nowrap;
  }
  .tag.flight { background: rgba(37,99,235,0.10); color: var(--accent); border: 1px solid rgba(37,99,235,0.25); }
  .tag.hotel  { background: rgba(22,163,74,0.10); color: var(--green); border: 1px solid rgba(22,163,74,0.25); }
  .tag.place  { background: rgba(124,58,237,0.10); color: var(--accent2); border: 1px solid rgba(124,58,237,0.25); }
  .tag.note   { background: rgba(217,119,6,0.10); color: var(--yellow); border: 1px solid rgba(217,119,6,0.20); }

  /* ── 항공 ── */
  .flight-card { position: relative; }
  .flight-route {
    display: flex; align-items: center; gap: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  .airport { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .flight-line {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .flight-line-bar {
    width: 100%; height: 1px; background: var(--border);
    position: relative;
  }
  .flight-line-bar::after {
    content: '✈'; position: absolute; right: -4px; top: -8px;
    font-size: 14px; color: var(--accent);
  }
  .flight-duration { font-size: 10px; color: var(--text3); }
  .flight-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;
  }
  .meta-item { }
  .meta-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
  .meta-value { font-size: 13px; font-weight: 500; }
  .travelers {
    display: flex; gap: 8px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .traveler {
    flex: 1; background: var(--surface2); border-radius: var(--radius-sm);
    padding: 8px 10px;
  }
  .traveler-name { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .traveler-info { font-size: 12px; font-weight: 500; }

  /* ── 호텔 ── */
  .hotel-nights {
    font-size: 11px; color: var(--text3);
    background: var(--surface2); border-radius: 4px;
    padding: 2px 6px; margin-left: auto;
  }
  .hotel-detail {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
  }
  .map-link {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--accent); font-size: 12px; text-decoration: none;
    margin-top: 10px; padding: 7px 12px;
    background: rgba(37,99,235,0.07); border-radius: var(--radius-sm);
    border: 1px solid rgba(37,99,235,0.18);
  }

  /* ── 여행지 ── */
  .place-number {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text3); flex-shrink: 0;
    font-family: 'DM Sans', sans-serif;
  }
  .place-name { font-size: 14px; font-weight: 500; flex: 1; }
  .place-cat {
    font-size: 10px; padding: 2px 7px; border-radius: 20px;
    background: var(--surface2); color: var(--text3);
  }
  .transport-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text2); margin-top: 6px;
  }

  /* ── 예산 ── */
  .budget-add {
    background: var(--surface2); border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  }
  .budget-add h3 { font-size: 13px; margin-bottom: 10px; color: var(--text2); }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .form-input {
    flex: 1; min-width: 100px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px;
    color: var(--text); font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    outline: none;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px;
    color: var(--text); font-size: 13px; outline: none;
  }
  .btn-submit {
    width: 100%; padding: 10px; background: var(--accent);
    color: white; border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-submit:active { opacity: 0.8; }
  .budget-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .budget-row:last-child { border-bottom: none; }
  .budget-who {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .budget-who.hj { background: rgba(37,99,235,0.12); }
  .budget-who.yj { background: rgba(22,163,74,0.12); }
  .budget-who.both { background: rgba(124,58,237,0.12); }
  .budget-desc { flex: 1; }
  .budget-desc .desc-main { font-size: 13px; }
  .budget-desc .desc-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .budget-amount { font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; }
  .budget-amount.exp { color: var(--red); }

  /* ── 구글지도 ── */
  .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .map-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px;
    text-decoration: none; display: block;
  }
  .map-item:active { opacity: 0.7; }
  .map-item-cat { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
  .map-item-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .map-item-date { font-size: 10px; color: var(--text3); margin-top: 3px; }
  .map-item.hotel .map-item-name { color: var(--green); }
  .map-item.sight .map-item-name { color: var(--accent); }
  .map-item.market .map-item-name { color: var(--yellow); }

  /* ── 섹션 타이틀 ── */
  .section-title {
    font-size: 11px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 16px 0 8px; padding-left: 2px;
  }

  /* ── 에러 ── */
  .error-box {
    background: rgba(220,38,38,0.07); border: 1px solid rgba(220,38,38,0.22);
    border-radius: var(--radius); padding: 16px; text-align: center;
  }
  .error-box p { color: var(--red); font-size: 13px; margin-bottom: 8px; }
  .retry-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); padding: 6px 14px; border-radius: 20px;
    font-size: 12px; cursor: pointer;
  }

  /* ── 바텀 네비 ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    display: flex; padding: 8px 0 20px;
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; cursor: pointer; padding: 4px 0;
    color: var(--text3); font-size: 10px; transition: color 0.15s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; }

  /* ── 검색 ── */
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px;
    margin-bottom: 12px;
  }
  .search-bar input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  }
  .search-bar input::placeholder { color: var(--text3); }
  .search-icon { color: var(--text3); font-size: 14px; }

  /* ── 토스트 ── */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px 18px; font-size: 13px;
    color: var(--text); z-index: 200; opacity: 0;
    transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── D-day 배너 ── */
  .dday-banner {
    background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(124,58,237,0.08));
    border: 1px solid rgba(37,99,235,0.18);
    border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .dday-label { font-size: 11px; color: var(--text2); }
  .dday-num { font-size: 28px; font-weight: 700; font-family: 'DM Sans', sans-serif; color: var(--accent); }
  .dday-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .dday-right { text-align: right; }
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
  <p style="font-size:16px;">비밀번호를 입력하세요</p>
  <input id="gate-pw" type="password" style="padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;">
  <button id="gate-btn" style="padding:10px 20px;background:#333;color:#fff;border:none;border-radius:8px;">입장</button>
  <p id="gate-err" style="color:red;font-size:13px;display:none;">틀렸어요</p>
</div>
<div class="header">
  <div class="header-top">
    <h1>✈️ 해진 <span>&</span> 양재</h1>
    <button class="sync-btn" onclick="syncAll()">↻ 새로고침</button>
  </div>
  <div class="date-range">2026.09.09 — 2026.10.15 · 37일</div>
</div>

<!-- 바텀 네비 -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchNav(0)" id="nav0">
    <div class="nav-icon">📅</div><div>일정</div>
  </div>
  <div class="nav-item" onclick="switchNav(1)" id="nav1">
    <div class="nav-icon">✈️</div><div>항공</div>
  </div>
  <div class="nav-item" onclick="switchNav(2)" id="nav2">
    <div class="nav-icon">🏨</div><div>숙소</div>
  </div>
  <div class="nav-item" onclick="switchNav(3)" id="nav3">
    <div class="nav-icon">📍</div><div>여행지</div>
  </div>
  <div class="nav-item" onclick="switchNav(4)" id="nav4">
    <div class="nav-icon">🗺️</div><div>지도</div>
  </div>
  <div class="nav-item" onclick="switchNav(5)" id="nav5">
    <div class="nav-icon">💰</div><div>예산</div>
  </div>
</div>

<div class="content">
  <!-- 0. 전체일정 -->
  <div class="section active" id="sec0">
    <div id="schedule-content"><div class="loading"><div class="spinner"></div><p>일정 불러오는 중...</p></div></div>
  </div>
  <!-- 1. 항공 -->
  <div class="section" id="sec1">
    <div id="flight-content"><div class="loading"><div class="spinner"></div><p>항공 정보 불러오는 중...</p></div></div>
  </div>
  <!-- 2. 숙소 -->
  <div class="section" id="sec2">
    <div id="hotel-content"><div class="loading"><div class="spinner"></div><p>숙소 정보 불러오는 중...</p></div></div>
  </div>
  <!-- 3. 여행지 -->
  <div class="section" id="sec3">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="place-search" placeholder="여행지 검색..." oninput="filterPlaces()">
    </div>
    <div id="place-content"><div class="loading"><div class="spinner"></div><p>여행지 불러오는 중...</p></div></div>
  </div>
  <!-- 4. 구글지도 -->
  <div class="section" id="sec4">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="map-search" placeholder="장소 검색..." oninput="filterMaps()">
    </div>
    <div id="map-content"><div class="loading"><div class="spinner"></div><p>지도 정보 불러오는 중...</p></div></div>
  </div>
  <!-- 5. 예산 -->
  <div class="section" id="sec5">
    <div id="budget-content"><div class="loading"><div class="spinner"></div><p>예산 불러오는 중...</p></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycby1Hf-QIQbkY9ZfEYg-G_UawxvjHgBhfaVCw7h-nv3ckTGZEPpSrL2c5-ly_BUBcKr6wA/exec';
const SHEETS = {
  schedule: 'idx_0',
  flight:   'idx_1',
  hotel:    'idx_2',
  place:    'idx_3',
  map:      'idx_4',
  budget:   'idx_5'
};

let cache = {};
let placeData = [], mapData = [];
let currentNav = 0;

// ── 유틸 ──────────────────────────────────────────────────────────
function toast(msg, dur=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function dday() {
  const start = new Date('2026-09-09');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((start - today) / 86400000);
  return diff;
}

function nightsBetween(ci, co) {
  try {
    const a = new Date(ci), b = new Date(co);
    return Math.round((b-a)/86400000);
  } catch { return '?'; }
}

// ── API 호출 ───────────────────────────────────────────────────────
async function fetchSheet(sheetName) {
  if (cache[sheetName]) return cache[sheetName];
  try {
    const res = await fetch(`${API}?action=read&sheet=${encodeURIComponent(sheetName)}`);
    const json = await res.json();
    if (json.data) { cache[sheetName] = json.data; return json.data; }
    return null;
  } catch(e) { return null; }
}

async function postRow(sheetName, data) {
  try {
    await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'append', sheet: sheetName, data })
    });
    delete cache[sheetName];
    toast('✅ 저장 완료!');
  } catch(e) { toast('❌ 저장 실패'); }
}

// ── 네비 전환 ─────────────────────────────────────────────────────
function switchNav(idx) {
  document.querySelectorAll('.section').forEach((s,i) => {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.nav-item').forEach((n,i) => {
    n.classList.toggle('active', i === idx);
  });
  currentNav = idx;
  if (idx === 0 && !cache[SHEETS.schedule]) renderSchedule();
  if (idx === 1 && !cache[SHEETS.flight])   renderFlights();
  if (idx === 2 && !cache[SHEETS.hotel])    renderHotels();
  if (idx === 3 && !cache[SHEETS.place])    renderPlaces();
  if (idx === 4 && !cache[SHEETS.map])      renderMaps();
  if (idx === 5)                             renderBudget();
}

function syncAll() {
  cache = {};
  toast('🔄 동기화 중...');
  if (currentNav === 0) renderSchedule();
  if (currentNav === 1) renderFlights();
  if (currentNav === 2) renderHotels();
  if (currentNav === 3) renderPlaces();
  if (currentNav === 4) renderMaps();
  if (currentNav === 5) renderBudget();
}

// ── 카드 토글 ─────────────────────────────────────────────────────
function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

// ── 0. 전체일정 ───────────────────────────────────────────────────
async function renderSchedule() {
  const el = document.getElementById('schedule-content');
  const data = await fetchSheet(SHEETS.schedule);
  if (!data) { el.innerHTML = errorHTML(() => renderSchedule()); return; }

  const rows = data.slice(4).filter(r => r[0] && r[0].toString().match(/\d{4}-\d{2}-\d{2}/));
  const dd = dday();
  const todayStr = new Date().toISOString().slice(0,10);
  const dowKr = ['일','월','화','수','목','금','토'];

  function buildCard(row, extraClass='') {
    const dateStr = row[0]?.toString().slice(0,10) || '';
    if (!dateStr) return '';
    const dateObj = new Date(dateStr + 'T00:00:00');
    const dow = dowKr[dateObj.getDay()];
    const dowClass = dateObj.getDay() === 6 ? 'sat' : dateObj.getDay() === 0 ? 'sun' : '';
    const isToday = dateStr === todayStr;
    const isPast  = dateStr < todayStr;
    const badgeClass = isToday ? 'today' : isPast ? 'past' : '';

    const flight = row[2] || '';
    const hotel  = row[5] || '';
    const place  = row[7] || '';
    const detail = row[8] || '';
    const memo   = row[11] || '';

    const hasFlight = !!flight;
    const cardClass = [
      'card schedule-day',
      isToday ? 'today-card open' : '',
      hasFlight ? 'has-flight' : '',
      isPast && !isToday ? 'past-card' : '',
      extraClass
    ].filter(Boolean).join(' ');

    const flightBadge = hasFlight ? `<span style="font-size:11px;margin-left:4px" title="${flight}">✈️</span>` : '';

    return `<div class="${cardClass}" data-date="${dateStr}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="date-badge ${badgeClass}">${dateStr.slice(5)}${isToday ? ' 오늘' : ''}</div>
        <div class="day-title">
          <span class="day-dow ${dowClass}">${dow}</span>
          ${place
            ? `<span class="day-place-main">${place}</span>`
            : `<span style="color:var(--text3);font-size:12px">이동일</span>`}
          ${flightBadge}
        </div>
        <span class="card-chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="info-row">
          ${flight ? `<span class="tag flight">✈ ${flight}</span>` : ''}
          ${hotel  ? `<span class="tag hotel">🏨 ${hotel}</span>` : ''}
          ${place  ? `<span class="tag place">📍 ${place}</span>` : ''}
        </div>
        ${detail ? `<div style="font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6">${detail}</div>` : ''}
        ${memo   ? `<div style="font-size:11px;color:var(--yellow);margin-top:6px">📌 ${memo}</div>` : ''}
      </div>
    </div>`;
  }

  // 오늘 기준으로 분리
  const todayIdx = rows.findIndex(r => r[0]?.toString().slice(0,10) === todayStr);
  const pastRows    = todayIdx > 0 ? rows.slice(0, todayIdx) : (todayStr > rows[rows.length-1]?.[0]?.toString().slice(0,10) ? rows : []);
  const todayRow    = todayIdx >= 0 ? rows[todayIdx] : null;
  const futureRows  = todayIdx >= 0 ? rows.slice(todayIdx + 1) : (todayStr < rows[0]?.[0]?.toString().slice(0,10) ? rows : []);

  // D-day 배너
  let bannerHTML = '';
  if (dd > 0) {
    bannerHTML = `<div class="dday-banner">
      <div><div class="dday-label">출발까지</div><div class="dday-num">D-${dd}</div></div>
      <div class="dday-right"><div style="font-size:13px;font-weight:600">9월 9일 출발</div><div class="dday-sub">ICN → FRA · KE945</div></div>
    </div>`;
  } else if (dd <= 0 && dd > -37) {
    bannerHTML = `<div class="dday-banner">
      <div><div class="dday-label">여행 진행 중 🎉</div><div class="dday-num">D+${Math.abs(dd)}</div></div>
      <div class="dday-right"><div style="font-size:13px;font-weight:600">10월 15일 귀국</div><div class="dday-sub">37일 중 ${Math.abs(dd)+1}일째</div></div>
    </div>`;
  }

  // 과거 (역순 — 위로 스크롤하면 더 오래된 날짜)
  const pastHTML   = [...pastRows].reverse().map(r => buildCard(r)).join('');
  const todayHTML  = todayRow ? buildCard(todayRow) : '';
  const futureHTML = futureRows.map(r => buildCard(r)).join('');

  el.innerHTML = `
    <div id="past-section" style="display:flex;flex-direction:column-reverse">${pastHTML}</div>
    ${bannerHTML}
    <div id="today-section">${todayHTML}</div>
    <div id="future-section">${futureHTML}</div>
  `;

  // 오늘 카드로 스크롤 (없으면 미래 첫 카드)
  setTimeout(() => {
    const target = el.querySelector('.today-card') || el.querySelector('#future-section .card');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 300);
}

// ── 1. 항공 ───────────────────────────────────────────────────────
function fmtDate(val) {
  // Handles both "2026-09-08T15:00:00.000Z" and "2026-09-08" → "09-08"
  const s = val?.toString() || '';
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[2]}-${m[3]}` : s;
}

function renderPlaceList(rows) {
  const el = document.getElementById('place-content');
  if (!rows.length) { el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px">검색 결과 없음</div>'; return; }

  // 날짜별 그룹
  const groups = {};
  rows.forEach(row => {
    const date = row[0]?.toString().slice(0,10) || '기타';
    if (!groups[date]) groups[date] = [];
    groups[date].push(row);
  });

  let html = '';
  Object.entries(groups).forEach(([date, items]) => {
    html += `<div class="section-title">${fmtDate(date)}</div>`;
    items.forEach(row => {
      const num   = row[1] || '';
      const name  = row[2] || '';
      const cat   = row[3] || '';
      const hours = row[4] || '';
      const fee   = row[5] || '';
      const move  = row[6] || '';
      const trans = row[7] || '';
      const needBook = row[8] || '';
      const bookId = row[9] || '';
      const memo  = row[10] || '';
      const mapUrl= row[11] || '';

      html += `<div class="card">
        <div class="card-header" onclick="toggleCard(this)">
          <div class="place-number">${num || '·'}</div>
          <div class="place-name">${name}</div>
          ${cat ? `<div class="place-cat">${cat}</div>` : ''}
          <span class="card-chevron">▼</span>
        </div>
        <div class="card-body">
          ${move ? `<div class="transport-badge">🚗 ${move} ${trans ? '· '+trans : ''}</div>` : ''}
          <div class="flight-meta" style="margin-top:8px">
            ${hours ? `<div class="meta-item"><div class="meta-label">운영시간</div><div class="meta-value" style="font-size:12px">${hours}</div></div>` : ''}
            ${fee   ? `<div class="meta-item"><div class="meta-label">입장료</div><div class="meta-value" style="font-size:12px">${fee}</div></div>` : ''}
            ${needBook === 'Y' ? `<div class="meta-item"><div class="meta-label">예약</div><div class="meta-value" style="font-size:12px;color:var(--red)">필요 ${bookId || ''}</div></div>` : ''}
          </div>
          ${memo ? `<div style="font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6">💡 ${memo}</div>` : ''}
          ${mapUrl ? `<a href="${mapUrl}" target="_blank" class="map-link">🗺️ 지도 보기</a>` : ''}
        </div>
      </div>`;
    });
  });

  el.innerHTML = html;
}

function filterPlaces() {
  const q = document.getElementById('place-search').value.toLowerCase();
  if (!q) { renderPlaceList(placeData); return; }
  const filtered = placeData.filter(r =>
    (r[2]||'').toLowerCase().includes(q) ||
    (r[3]||'').toLowerCase().includes(q) ||
    (r[10]||'').toLowerCase().includes(q)

  renderPlaceList(filtered);
}

function renderMapGrid(rows) {
  const el = document.getElementById('map-content');
  if (!rows.length) { el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px">검색 결과 없음</div>'; return; }

  const hotels = rows.filter(r => ['호텔','숙소'].includes(r[2]));
  const sights = rows.filter(r => ['관광지','유적지'].includes(r[2]));
  const others = rows.filter(r => !['호텔','숙소','관광지','유적지'].includes(r[2]));

  function makeGrid(items, cls) {
    return items.map(row => `
      <a class="map-item ${cls}" href="${row[4]}" target="_blank">
        <div class="map-item-cat">${row[2] || ''}</div>
        <div class="map-item-name">${row[1]}</div>
        <div class="map-item-date">${row[0] || ''}</div>

  }

  el.innerHTML = `
    ${hotels.length ? `<div class="section-title">🏨 숙소 · ${hotels.length}곳</div><div class="map-grid">${makeGrid(hotels,'hotel')}</div>` : ''}
    ${sights.length ? `<div class="section-title">📍 관광지 · ${sights.length}곳</div><div class="map-grid">${makeGrid(sights,'sight')}</div>` : ''}
    ${others.length ? `<div class="section-title">기타 · ${others.length}곳</div><div class="map-grid">${makeGrid(others,'market')}</div>` : ''}
  `;
}

function filterMaps() {
  const q = document.getElementById('map-search').value.toLowerCase();

  renderMapGrid(mapData.filter(r =>
    (r[1]||'').toLowerCase().includes(q) ||

async function renderBudget() {
  const el = document.getElementById('budget-content');

  const rows = data.slice(4).filter(r => r[0] || r[2]);

      <h3>+ 지출 추가</h3>
      <div class="form-row">
        <input class="form-input" id="b-date" type="date" value="${new Date().toISOString().slice(0,10)}" style="flex:1.2">
        <select class="form-select" id="b-who">
          <option value="💙 해진">💙 해진</option>
          <option value="💚 양재">💚 양재</option>

      </div>
      <div class="form-row">

      </div>
      <div class="form-row">
        <input class="form-input" id="b-desc" placeholder="내용" style="flex:2">

      </div>
      <button class="btn-submit" onclick="addBudget()">저장</button>
    </div>`;

  // 합계
  const total = rows.reduce((sum, r) => sum + (parseFloat(r[5]) || 0), 0);
  const hjTotal = rows.filter(r => (r[3]||'').includes('해진')).reduce((s,r) => s+(parseFloat(r[5])||0), 0);
  const yjTotal = rows.filter(r => (r[3]||'').includes('양재')).reduce((s,r) => s+(parseFloat(r[5])||0), 0);

  let summary = `
    <div class="card" style="margin-bottom:12px">
      <div style="padding:14px 16px">
        <div style="font-size:11px;color:var(--text3);margin-bottom:8px">총 지출</div>
        <div style="font-size:26px;font-weight:700;font-family:'DM Sans',sans-serif;color:var(--red)">₩${total.toLocaleString()}</div>
        <div style="display:flex;gap:16px;margin-top:10px">
          <div><div style="font-size:10px;color:var(--text3)">💙 해진</div><div style="font-size:14px;font-weight:600">₩${hjTotal.toLocaleString()}</div></div>
          <div><div style="font-size:10px;color:var(--text3)">💚 양재</div><div style="font-size:14px;font-weight:600">₩${yjTotal.toLocaleString()}</div></div>
        </div>
      </div>
    </div>`;

  let list = `<div class="section-title">내역 · ${rows.length}건</div><div class="card"><div style="padding:4px 14px">`;
  rows.reverse().forEach(row => {
    const who = row[3] || '';
    const whoClass = who.includes('해진') ? 'hj' : who.includes('양재') ? 'yj' : 'both';
    const emoji = who.includes('해진') ? '💙' : who.includes('양재') ? '💚' : '🔷';
    const amt = parseFloat(row[5]) || 0;
    list += `<div class="budget-row">
      <div class="budget-who ${whoClass}">${emoji}</div>
      <div class="budget-desc">
        <div class="desc-main">${row[2] || '-'}</div>
        <div class="desc-sub">${fmtDate(row[0])} · ${row[1] || ''}</div>
      </div>
      <div class="budget-amount exp">₩${amt.toLocaleString()}</div>
    </div>`;
  });
  list += '</div></div>';

  el.innerHTML = addForm + summary + (rows.length ? list : '<div style="text-align:center;color:var(--text3);padding:20px">아직 내역이 없어요</div>');
}

async function addBudget() {
  const date = document.getElementById('b-date').value;
  const who  = document.getElementById('b-who').value;
  const cat  = document.getElementById('b-cat').value;
  const desc = document.getElementById('b-desc').value;
  const amt  = document.getElementById('b-amt').value;
  if (!desc || !amt) { toast('내용과 금액을 입력해주세요'); return; }
  await postRow(SHEETS.budget, [date, cat, desc, who, '', amt, '', '', '']);
  renderBudget();
}

const CORRECT_HASH = "d05237d0f34432aac1885e1e82c5bf43bbf489ea7d6a049aff64c6a1225a506c";

async function hashPw(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

  if (localStorage.getItem('travel2026_unlocked') === 'yes') {
    document.getElementById('gate').style.display = 'none';
    return;

  document.getElementById('gate-btn').onclick = async () => {
    const input = document.getElementById('gate-pw').value;
    const hash = await hashPw(input);
    if (hash === CORRECT_HASH) {
      localStorage.setItem('travel2026_unlocked', 'yes');
      document.getElementById('gate').style.display = 'none';
    } else {
      document.getElementById('gate-err').style.display = 'block';
    }
  };
  document.getElementById('gate-pw').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('gate-btn').click();

})();
